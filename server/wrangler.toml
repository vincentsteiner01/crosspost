# Deploy with:  cd server && npx wrangler deploy
name = "crosspost-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# The address of your GitHub Pages site (no trailing slash).
ALLOWED_ORIGIN = "https://vincentsteiner01.github.io"
# Unaudited TikTok apps may only post privately. Change after TikTok's audit, e.g. PUBLIC_TO_EVERYONE.
TIKTOK_PRIVACY = "SELF_ONLY"
TIKTOK_VERIFICATION_FILENAME = "tiktokF3W9nYQ2lkglDFjWrNSWbMaWAQ9d89Vn.txt"
TIKTOK_VERIFICATION_CONTENT = "tiktok-developers-site-verification=F3W9nYQ2lkglDFjWrNSWbMaWAQ9d89Vn"
# This worker's own address; TikTok fetches workflow videos from <PUBLIC_URL>/media/….
PUBLIC_URL = "https://crosspost-api.vincentsteiner01.workers.dev"
# The app; links handed out by the inbox (iPhone Shortcut) open there.
SITE_URL = "https://vincentsteiner01.github.io/crosspost/dashboard/"
# How workflows send to TikTok: "inbox" (draft in the TikTok app) or "direct" (needs TikTok's audit to be public).
TIKTOK_DEFAULT_MODE = "inbox"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "crosspost-media"

# Workflows, the accounts they use and every video they picked up (schema: migrations/).
[[d1_databases]]
binding = "DB"
database_name = "crosspost"
database_id = "ff66ff55-4728-4a5e-8089-5e7052a5576d"
migrations_dir = "migrations"

# Server-side workflows: check the sources and publish what is due every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

# Keep request logs (Workers Logs, included in the free plan) for debugging.
[observability]
enabled = true
