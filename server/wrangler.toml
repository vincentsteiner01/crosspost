# Deploy with:  cd server && npx wrangler deploy
name = "crosspost-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# The address of your GitHub Pages site (no trailing slash).
ALLOWED_ORIGIN = "https://vincentsteiner01.github.io"
# Unaudited TikTok apps may only post privately. Change after TikTok's audit, e.g. PUBLIC_TO_EVERYONE.
TIKTOK_PRIVACY = "SELF_ONLY"
TIKTOK_VERIFICATION_FILENAME = ""
TIKTOK_VERIFICATION_CONTENT = ""

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "crosspost-media"
